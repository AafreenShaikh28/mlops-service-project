services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.10.1
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
      --default-artifact-root mlflow-artifacts:/
      --serve-artifacts
      --allowed-hosts "mlflow:*,localhost:*,127.0.0.1:*"
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - mlflow-data:/mlflow
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MODEL_PATH: /models/house_price_pipeline.pkl
    volumes:
      - ./models:/models:ro
    depends_on:
      mlflow:
        condition: service_healthy

  train:
    build:
      context: .
      dockerfile: Dockerfile.train
    profiles: ["train"]
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      - ./data:/app/data
      - ./configs:/app/configs:ro
      - ./models:/app/models
      - ./reports:/app/reports
    depends_on:
      mlflow:
        condition: service_healthy

volumes:
  mlflow-data:
